<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mueblería Mercado</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <h1>🪑 Mueblería Mercado</h1>
  <h2>Para tu hogar</h2>

  <p>Aplicación funcionando correctamente.</p>

  <p id="conexion">Conectando con la base de datos...</p>

  <script>
    const SUPABASE_URL = "https://ggaqknpwlohpbyxeyque.supabase.co";

    const SUPABASE_KEY = "sb_publishable_v3Tx1jkhW4FIPjpRpZyjvA_vGjO_iiU";

    const supabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function comprobarConexion() {
      const mensaje = document.getElementById("conexion");

      try {
        const respuesta = await fetch(
          SUPABASE_URL + "/rest/v1/categorias?select=id&limit=1",
          {
            method: "GET",
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": "Bearer " + SUPABASE_KEY
            }
          }
        );

        if (respuesta.ok) {
          mensaje.textContent = "✅ Conectado correctamente con Supabase.";
        } else {
          mensaje.textContent = "⚠️ Supabase responde, pero falta configurar permisos.";
          console.log(await respuesta.text());
        }
      } catch (error) {
        mensaje.textContent = "❌ Error de conexión con Supabase.";
        console.log(error);
      }
    }

    comprobarConexion();
  </script>

</body>
</html>
