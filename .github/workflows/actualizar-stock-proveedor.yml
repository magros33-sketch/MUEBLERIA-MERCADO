name: Actualizar inventario y administración

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Aplicar cambios de administración
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          nl=chr(10)
          marker='<!-- costo-total-inventario-20261009 -->'
          if marker not in s:
              objetivo='<div class="tarjeta">'+nl+'<h3>📊 Resumen</h3>'+nl+'<div id="resumenAdministracion">Cargando resumen...</div>'+nl+'<button onclick="cargarResumenAdministracion()">🔄 Actualizar resumen</button>'+nl+'</div>'
              bloque=nl+marker+nl+'<div class="tarjeta">'+nl+'<h3>📦 Costo total del inventario</h3>'+nl+'<div class="ayuda">Valor actual del inventario calculado con el costo de cada artículo multiplicado por las unidades que hay en stock.</div>'+nl+'<div id="costoTotalInventario" class="precio-venta">$0.00</div>'+nl+'<button type="button" onclick="cargarCostoTotalInventario()">🔄 Actualizar costo del inventario</button>'+nl+'</div>'
              if objetivo not in s:
                  raise SystemExit('No se encontró el bloque de Resumen de Administración')
              s=s.replace(objetivo,objetivo+bloque,1)
          script_marker='<script id="costo-total-inventario-script-20261009">'
          if script_marker not in s:
              js='<script id="costo-total-inventario-script-20261009">(function(){let temporizador=null;window.cargarCostoTotalInventario=async function(){const box=document.getElementById("costoTotalInventario");if(!box)return;box.textContent="🔄 Calculando...";try{const r=await fetch(SUPABASE_URL+"/rest/v1/articulos?select=stock,costo&activo=eq.true&limit=5000",{headers:headersSupabase,cache:"no-store"});if(!r.ok)throw new Error(await r.text());const datos=await r.json();const total=datos.reduce(function(s,a){return s+(Number(a.stock||0)*Number(a.costo||0));},0);box.textContent=numeroAdmin(total).toLocaleString("es-MX",{style:"currency",currency:"MXN"});}catch(e){console.error("Error calculando costo total del inventario:",e);box.textContent="❌ No se pudo calcular";}};function iniciarActualizacion(){if(temporizador)clearInterval(temporizador);cargarCostoTotalInventario();temporizador=setInterval(function(){const panel=document.getElementById("adminPanel");if(panel&&panel.style.display!=="none")cargarCostoTotalInventario();},10000);}const originalEntrar=window.entrarAdministracion;if(typeof originalEntrar==="function"){window.entrarAdministracion=async function(){await originalEntrar.apply(this,arguments);const panel=document.getElementById("adminPanel");if(panel&&panel.style.display!=="none")iniciarActualizacion();};}const originalResumen=window.cargarResumenAdministracion;if(typeof originalResumen==="function"){window.cargarResumenAdministracion=async function(){const resultado=await originalResumen.apply(this,arguments);cargarCostoTotalInventario();return resultado;};}const originalSalir=window.salirAdministracion;if(typeof originalSalir==="function"){window.salirAdministracion=function(){if(temporizador)clearInterval(temporizador);temporizador=null;return originalSalir.apply(this,arguments);};}})();</script>'+nl
              s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Verificar y guardar
        run: |
          grep -q 'costo-total-inventario-20261009' index.html
          grep -q 'cargarCostoTotalInventario' index.html
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
          else
            git commit -m "Mostrar costo total del inventario en Administración"
            git push
          fi
