name: Añadir orden por proveedor en stock bajo

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Añadir ordenación por proveedor
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_html = '''<div class="ayuda">Aquí aparecen automáticamente los artículos cuyo stock está en el mínimo o por debajo, para saber qué productos hay que pedir.</div>\n<button onclick="mostrarProductosStockBajo()">🔄 Actualizar productos para pedir</button>'''
          new_html = '''<div class="ayuda">Aquí aparecen automáticamente los artículos cuyo stock está en el mínimo o por debajo, para saber qué productos hay que pedir.</div>\n<label>Ordenar por</label>\n<select id="ordenStockBajo" onchange="mostrarProductosStockBajo()">\n<option value="faltante">Mayor necesidad de reposición</option>\n<option value="proveedor">Proveedor</option>\n</select>\n<button onclick="mostrarProductosStockBajo()">🔄 Actualizar productos para pedir</button>'''
          if old_html in s and 'id="ordenStockBajo"' not in s:
              s = s.replace(old_html, new_html, 1)

          old_js = '''const bajos=(Array.isArray(articulos)?articulos:[])\n.filter(function(a){\n  const stock=Number(a.stock||0);\n  const minimo=Number(a.stock_minimo||0);\n  return minimo>0 && stock<=minimo;\n})\n.sort(function(a,b){\n  const fa=Number(a.stock||0)-Number(a.stock_minimo||0);\n  const fb=Number(b.stock||0)-Number(b.stock_minimo||0);\n  return fa-fb;\n});'''
          new_js = '''const bajos=(Array.isArray(articulos)?articulos:[])\n.filter(function(a){\n  const stock=Number(a.stock||0);\n  const minimo=Number(a.stock_minimo||0);\n  return minimo>0 && stock<=minimo;\n});\n\nconst orden=document.getElementById("ordenStockBajo")?.value||"faltante";\n\nbajos.sort(function(a,b){\n  if(orden==="proveedor"){\n    const pa=(proveedores.find(function(p){return String(p.id)===String(a.proveedor_id);})||{}).nombre||"Sin proveedor";\n    const pb=(proveedores.find(function(p){return String(p.id)===String(b.proveedor_id);})||{}).nombre||"Sin proveedor";\n    return pa.localeCompare(pb,"es",{sensitivity:"base"}) || String(a.nombre||"").localeCompare(String(b.nombre||""),"es",{sensitivity:"base"});\n  }\n  const fa=Number(a.stock||0)-Number(a.stock_minimo||0);\n  const fb=Number(b.stock||0)-Number(b.stock_minimo||0);\n  return fa-fb;\n});'''
          if old_js in s and 'const orden=document.getElementById("ordenStockBajo")' not in s:
              s = s.replace(old_js, new_js, 1)

          marker = '<!-- orden-stock-bajo-proveedor-20261007 -->'
          if marker not in s:
              s = s.replace('</body>', marker + '\n</body>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
          else
            git commit -m "Añadir orden por proveedor a productos con stock bajo"
            git push
          fi
