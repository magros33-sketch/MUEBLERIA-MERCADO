name: Añadir costo total del inventario

on:
  push:
    paths:
      - '.github/workflows/patch-costo-inventario.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Añadir costo total del inventario
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          marker = '<!-- costo-total-inventario-20261009 -->'
          if marker in s:
              print('La corrección ya estaba aplicada')
              raise SystemExit(0)

          bloque = '''
<!-- costo-total-inventario-20261009 -->
<div class="tarjeta">
<h3>📦 Costo total del inventario</h3>
<div class="ayuda">Valor actual del inventario calculado con el costo de cada artículo multiplicado por las unidades que hay en stock.</div>
<div id="costoTotalInventario" class="precio-venta">$0.00</div>
<button type="button" onclick="cargarCostoTotalInventario()">🔄 Actualizar costo del inventario</button>
</div>
'''

          objetivo = '''<div class="tarjeta">
<h3>📊 Resumen</h3>
<div id="resumenAdministracion">Cargando resumen...</div>
<button onclick="cargarResumenAdministracion()">🔄 Actualizar resumen</button>
</div>'''

          if objetivo not in s:
              raise SystemExit('No se encontró el bloque de Resumen de Administración')

          s = s.replace(objetivo, objetivo + '\n' + bloque, 1)

          script = r'''<script id="costo-total-inventario-script-20261009">
(function(){
  let temporizador=null;

  window.cargarCostoTotalInventario=async function(){
    const box=document.getElementById('costoTotalInventario');
    if(!box)return;
    box.textContent='🔄 Calculando...';
    try{
      const r=await fetch(SUPABASE_URL+'/rest/v1/articulos?select=stock,costo&activo=eq.true&limit=5000',{
        headers:headersSupabase,
        cache:'no-store'
      });
      if(!r.ok)throw new Error(await r.text());
      const articulosInventario=await r.json();
      const total=articulosInventario.reduce(function(s,a){
        return s+(Number(a.stock||0)*Number(a.costo||0));
      },0);
      box.textContent=numeroAdmin(total).toLocaleString('es-MX',{style:'currency',currency:'MXN'});
    }catch(e){
      console.error('Error calculando costo total del inventario:',e);
      box.textContent='❌ No se pudo calcular';
    }
  };

  function iniciarActualizacion(){
    if(temporizador)clearInterval(temporizador);
    cargarCostoTotalInventario();
    temporizador=setInterval(function(){
      const panel=document.getElementById('adminPanel');
      if(panel && panel.style.display!=='none')cargarCostoTotalInventario();
    },10000);
  }

  const originalEntrar=window.entrarAdministracion;
  if(typeof originalEntrar==='function'){
    window.entrarAdministracion=async function(){
      await originalEntrar.apply(this,arguments);
      const panel=document.getElementById('adminPanel');
      if(panel && panel.style.display!=='none')iniciarActualizacion();
    };
  }

  const originalResumen=window.cargarResumenAdministracion;
  if(typeof originalResumen==='function'){
    window.cargarResumenAdministracion=async function(){
      const resultado=await originalResumen.apply(this,arguments);
      cargarCostoTotalInventario();
      return resultado;
    };
  }

  const originalSalir=window.salirAdministracion;
  if(typeof originalSalir==='function'){
    window.salirAdministracion=function(){
      if(temporizador)clearInterval(temporizador);
      temporizador=null;
      return originalSalir.apply(this,arguments);
    };
  }

  document.addEventListener('DOMContentLoaded',function(){
    const panel=document.getElementById('adminPanel');
    if(panel && panel.style.display!=='none')iniciarActualizacion();
  });
})();
</script>
'''

          s=s.replace('</body>', script+'\n</body>', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verificar modificación
        run: |
          grep -q 'costo-total-inventario-20261009' index.html
          grep -q 'cargarCostoTotalInventario' index.html
          git diff --check
      - name: Guardar cambios
        run: |
          git config user.name 'ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Mostrar costo total del inventario en Administración' || exit 0
          git push
      - name: Eliminar parche temporal
        if: always()
        run: |
          rm -f .github/workflows/patch-costo-inventario.yml
          git add -A
          git commit -m 'Eliminar parche temporal de costo de inventario' || true
          git push || true
